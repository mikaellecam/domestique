<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A bike on a direct-drive trainer, drawn on a 2-unit grid so the 16 px icon stays sharp.
       The rim of the disc closes the front triangle, where the head tube would be. -->
  <clipPath id="disc"><circle cx="16" cy="16" r="16"/></clipPath>
  <circle cx="16" cy="16" r="16" fill="#1a8cd8"/>
  <g fill="#fff">
    <path d="M12 21.5L16 25" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <rect x="4" y="24" width="6" height="2" rx="1"/>
    <rect x="13" y="24" width="6" height="2" rx="1"/>
    <path d="M9.33 16.24L6.65 24.51A0.9 0.9 0 0 1 8.15 25.49L14.67 19.76Z"/>
    <circle cx="12" cy="18" r="4"/>
    <circle cx="21" cy="19" r="3"/>
    <rect x="14" y="4" width="6" height="2" rx="1"/>
  </g>
  <path clip-path="url(#disc)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M12 18L21 19L16 6M12 18L18.5 12.5M17.15 9L32.39 9M21 19L31.76 7.54"/>
  <circle cx="12" cy="18" r="1" fill="#1a8cd8"/>
  <circle cx="21" cy="19" r="1" fill="#1a8cd8"/>
</svg>
