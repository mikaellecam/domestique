[package]
name = "whoosh2garmin"
version = "0.1.0"
edition = "2024"
default-run = "whoosh2garmin"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
embedded-io-adapters = { version = "0.7", features = ["std"] }
jiff = "0.2"
rpassword = "7.5.4"
rustyfit = "=0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }
# The desktop app's tray process.
notify = "8.2.0"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
strip = true

# The binaries handed to users: smaller and faster, but slow to build.
# cargo build --profile dist
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
