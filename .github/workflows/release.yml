name: Release

on:
  push:
    tags: ["v*"]
  # Builds the archives without releasing them, to try a release first.
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: domestique-windows-x86_64.zip
            # Links the C runtime in, so the exe runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          # The oldest Ubuntu runner, for the oldest glibc the binaries need.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: domestique-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: domestique-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - run: cargo build --locked --profile dist --target "$TARGET"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo about generate --locked --target "$TARGET" -o THIRD_PARTY_LICENSES.html about.hbs
      - run: mkdir pkg && cp LICENSE THIRD_PARTY_LICENSES.html pkg/

      - if: runner.os == 'Windows'
        run: |
          cp target/"$TARGET"/dist/domestique.exe target/"$TARGET"/dist/domestique-cli.exe pkg/
          cd pkg && 7z a -tzip "../$ARCHIVE" domestique.exe domestique-cli.exe LICENSE THIRD_PARTY_LICENSES.html

      - if: runner.os == 'Linux'
        run: |
          cp target/"$TARGET"/dist/domestique target/"$TARGET"/dist/domestique-cli pkg/
          tar -czf "$ARCHIVE" -C pkg domestique domestique-cli LICENSE THIRD_PARTY_LICENSES.html

      - if: runner.os == 'macOS'
        run: |
          app=pkg/Domestique.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources" icon.iconset
          cp target/"$TARGET"/dist/domestique "$app/MacOS/"
          cp target/"$TARGET"/dist/domestique-cli pkg/
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s * 2)) $((s * 2)) assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Resources/Domestique.icns"
          # LSUIElement: a tray app, with no Dock icon.
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>domestique</string>
              <key>CFBundleName</key><string>Domestique</string>
              <key>CFBundleIdentifier</key><string>io.github.mikaellecam.domestique</string>
              <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleIconFile</key><string>Domestique.icns</string>
              <key>LSUIElement</key><true/>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Info.plist"
          # Ad-hoc, with no identity: Apple Silicon runs only signed apps.
          codesign --force --sign - pkg/Domestique.app
          cd pkg && zip -r "../$ARCHIVE" Domestique.app domestique-cli LICENSE THIRD_PARTY_LICENSES.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
